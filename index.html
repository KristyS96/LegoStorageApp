<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d01012" />
    <title>Brick Finder</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>🧱 Brick Finder</h1>
      <span class="header-right"><span id="summary" class="summary"></span><a id="sync-status" class="sync-status" href="#/settings" hidden></a></span>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Main">
      <a href="#/find" data-tab="find"><span>🔍</span>Find</a>
      <a href="#/identify" data-tab="identify"><span>📷</span>Identify</a>
      <a href="#/build" data-tab="build"><span>🏗️</span>Build</a>
      <a href="#/storage" data-tab="storage"><span>🗄️</span>Storage</a>
      <a href="#/labels" data-tab="labels"><span>🏷️</span>Labels</a>
      <a href="#/settings" data-tab="settings"><span>⚙️</span>Settings</a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      // If the app doesn't start, say why instead of showing a blank page. Usually it was
      // just updated and the browser mixed old and new files: reloading fixes that.
      (function () {
        var timer;
        function show(message) {
          var view = document.getElementById('view');
          if (!view || view.dataset.started) return;
          clearTimeout(timer);
          view.innerHTML =
            '<div class="card"><h2 style="margin-top:0">The app didn\'t start</h2>' +
            '<p>It was probably just updated. Reload to get the new version.</p>' +
            '<div class="actions"><button class="primary" type="button" id="boot-reload">Reload</button></div>' +
            '<p class="muted" id="boot-error" style="font-size:0.8rem;word-break:break-word"></p></div>';
          document.getElementById('boot-error').textContent = message;
          document.getElementById('boot-reload').onclick = function () {
            location.reload();
          };
        }
        // Capture phase: a script that fails to load fires "error" on the element, which doesn't bubble.
        window.addEventListener(
          'error',
          function (e) {
            var src = e.target && (e.target.src || e.target.href);
            show(e.message || (src ? "Couldn't load " + src : 'Unknown error'));
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.message) || e.reason));
        });
        timer = setTimeout(function () {
          show('It took too long to start.');
        }, 10000);
      })();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
